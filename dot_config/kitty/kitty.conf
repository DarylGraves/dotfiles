# Shell & Mouse
shell /usr/bin/fish
mouse_enabled yes

# Layouts
enabled_layouts splits,stack

# Splits (Alt + Shift + _/=)
map alt+shift+equal launch --location=hsplit --cwd=current
map alt+shift+minus launch --location=vsplit --cwd=current

# Pane Navigation (Ctrl+a + vim keys)
map ctrl+a>h neighboring_window left
map ctrl+a>l neighboring_window right
map ctrl+a>k neighboring_window top
map ctrl+a>j neighboring_window bottom

# Tabs (Equivalent to tmux windows)
map ctrl+a>c new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5

# Toggle Stack / Fullscreen Layout
map ctrl+a>b toggle_layout stack

# Tab Bar Styling
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #1a1b26
active_tab_background   #e0af68
inactive_tab_foreground #c0caf5
inactive_tab_background #24283b

# Tokyo Night Colors
background #000000
foreground #c0caf5
active_border_color #e0af68
inactive_border_color #414868
