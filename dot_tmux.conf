# Load Fish
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

# Enable Mouse Mode
set -g mouse on

# Ctrl+a for Prefix
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Reload file with 'r'
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Arrow to change panes
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Alt + Shift + _/= to split
bind -n M-+ split-window -h -c "#{pane_current_path}"
bind -n M-_ split-window -v -c "#{pane_current_path}"

# Ctrl+A and B toggles tmux bar
bind-key b set-option -g status

# F12 toggles local tmux off/on (Perfect for SSH/nested tmux)
bind -T root F12 \
  set key-table off\;\
  set status-style "bg=#24283b,fg=#565f89"

bind -T off F12 \
  set -u key-table\;\
  set -u status-style

# Colour
set -g status-style "bg=#1a1b26,fg=#e0af68"


